<div class="{{className}}"><div class="eevenkoto-stepper__info"><strong class="eevenkoto-stepper__label">{{label}}</strong>{{description}}</div><div class="eevenkoto-stepper__controls"><button type="button" class="{{buttonClass}}" aria-label="{{decreaseAriaLabel}}" data-role="stepper-btn" data-dir="-1"{{fieldAttr}}{{decreaseDisabled}}>−</button><span class="eevenkoto-stepper__value" role="status" aria-live="polite"{{valFieldAttr}}>{{value}}</span><button type="button" class="{{buttonClass}}" aria-label="{{increaseAriaLabel}}" data-role="stepper-btn" data-dir="1"{{fieldAttr}}{{increaseDisabled}}>+</button></div></div>
